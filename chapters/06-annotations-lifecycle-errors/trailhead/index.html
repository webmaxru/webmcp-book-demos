<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trailhead — outdoor gear (Chapter 6 demo)</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; margin: 0 auto; max-width: 52rem; padding: 1rem; color: #1d2b24; }
    header { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 2px solid #2f6b4f; }
    #agent-banner { background: #fff3c4; border: 1px solid #e0b400; padding: .4rem .8rem; border-radius: .4rem; }
    #products li { margin: .3rem 0; }
    .price { color: #2f6b4f; font-weight: 600; }
    section { margin-top: 1.2rem; }
    #activity { font-family: ui-monospace, monospace; font-size: .85rem; color: #555; }
  </style>
</head>
<body>
  <header><h1>Trailhead</h1><span>Prices in NOK</span></header>
  <p id="agent-banner" hidden></p>
  <section>
    <form id="search-form"><input id="q" value="tent" aria-label="Search"> <button>Search</button></form>
    <ul id="products"></ul>
  </section>
  <section>
    <h2>Cart</h2>
    <ul id="cart-lines"></ul>
    <p>Total: <span id="cart-total">0 kr</span></p>
    <button id="checkout-button" type="button" disabled>Check out</button>
    <p id="order-status"></p>
  </section>
  <section>
    <h2>Agent activity</h2>
    <ul id="activity"></ul>
  </section>
  <dialog id="confirm-dialog">
    <p><strong>Place this order?</strong></p>
    <p id="confirm-summary"></p>
    <button id="confirm-cancel" type="button">Cancel</button>
    <button id="confirm-ok" type="button">Place order</button>
  </dialog>
  <script type="module" src="app.js"></script>
</body>
</html>
