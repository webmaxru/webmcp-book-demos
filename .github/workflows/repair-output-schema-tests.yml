name: Repair outputSchema test setup

on:
  push:
    branches: [output-schema-update]
    paths:
      - .github/workflows/repair-output-schema-tests.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: output-schema-update
      - name: Add Test Agent readiness checks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('chapters/09-first-webmcp-app/tests/run-tests.mjs')
          source = path.read_text()

          # Keep the invalid-input test from racing page initialization.
          test_marker = "native: invalid input comes back as a value the planner can read"
          call_marker = "page.evaluate((date) => window.testAgent.call('book_table'"
          if test_marker not in source:
              raise SystemExit('Invalid-input test marker not found')
          start = source.index(test_marker)
          call = source.find(call_marker, start)
          if call < 0:
              raise SystemExit('Invalid-input Test Agent call not found')
          line_start = source.rfind('\n', 0, call) + 1
          indent = source[line_start:call]
          guard = indent + "await page.waitForFunction(() => typeof window.testAgent?.call === 'function');\n"
          if "window.testAgent?.call === 'function'" not in source[start:call]:
              source = source[:line_start] + guard + source[line_start:]

          # The main outputSchema workflow expects the same readiness check in openPage.
          if "if (new URL(url).searchParams.has('test-agent'))" not in source:
              pattern = re.compile(r"(?m)^(\s*)await page\.waitForFunction\(\(\) => !document\.querySelector\('#webmcp-status'\)\.textContent\.startsWith\('Checking'\)\);\n(\s*)return \{ page, errors, context, chip: \(\) => page\.textContent\('#webmcp-status'\) \};$")
              match = pattern.search(source)
              if not match:
                  raise SystemExit('openPage status-wait block not found')
              indent = match.group(2)
              replacement = match.group(0).replace(
                  '\n' + indent + 'return {',
                  "\n" + indent + "if (new URL(url).searchParams.has('test-agent')) {\n" + indent + "  await page.waitForFunction(() => typeof window.testAgent?.call === 'function');\n" + indent + "}\n" + indent + 'return {'
              )
              source = source[:match.start()] + replacement + source[match.end():]

          path.write_text(source)
          print('Test Agent readiness guards are present')
          PY
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+actions[bot]@users.noreply.github.com"
          git add chapters/09-first-webmcp-app/tests/run-tests.mjs
          if ! git diff --cached --quiet; then
            git commit -m "Wait for Test Agent before test calls"
            git push origin HEAD:output-schema-update
          fi
