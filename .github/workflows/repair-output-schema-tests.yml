name: Repair outputSchema test setup

on:
  push:
    branches: [output-schema-update]
    paths:
      - .github/workflows/repair-output-schema-tests.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: output-schema-update
      - name: Wait for the Test Agent before the invalid-input call
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('chapters/09-first-webmcp-app/tests/run-tests.mjs')
          source = path.read_text()
          before = "    const r = await page.evaluate((date) => window.testAgent.call('book_table', { date, time: '7pm', partySize: 2 }), DATE);"
          after = "    await page.waitForFunction(() => typeof window.testAgent?.call === 'function');\n" + before
          if after in source:
              print('Test Agent readiness guard already present')
          elif before in source:
              path.write_text(source.replace(before, after, 1))
              print('Added Test Agent readiness guard')
          else:
              raise SystemExit('Invalid-input call anchor not found')
          PY
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+actions[bot]@users.noreply.github.com"
          git add chapters/09-first-webmcp-app/tests/run-tests.mjs
          if ! git diff --cached --quiet; then
            git commit -m "Wait for Test Agent in invalid-input test"
            git push origin HEAD:output-schema-update
          fi
