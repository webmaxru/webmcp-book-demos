name: Finalize WebMCP outputSchema demo docs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: output-schema-update
      - name: Update Chapter 9 documentation and clean temporary workflows
        run: |
          python3 - <<'PY'
          from pathlib import Path

          readme = Path('chapters/09-first-webmcp-app/README.md')
          text = readme.read_text(encoding='utf-8')
          old_command = 'npm test                       # 21 checks (22 with CHAPTER_MD=…/WebMCP_Ch09_First_WebMCP_App.md)'
          new_command = 'npm test                       # 21 browser/static checks + 5 output-schema tests; +1 listing check with CHAPTER_MD=…/WebMCP_Ch09_First_WebMCP_App.md'
          if old_command in text:
              text = text.replace(old_command, new_command, 1)
          elif new_command not in text:
              raise SystemExit('Chapter 9 test command anchor not found')

          marker = '## Test results (14 October 2026, re-run 2 November 2026)'
          section = '''## Output-schema validation

`search_availability` and `book_table` declare optional JSON Schemas for their return values. The Test Agent parses each `executeTool()` result and validates it against the declared schema before it enters the transcript or the next planner request. A mismatch becomes a concise validation error with a schema path and safe reason; the invalid result is not retained or shown to the planner. Tools without `outputSchema` remain valid, including tools that return plain text.

PR #254 added `outputSchema` to the WebMCP tool dictionaries. Issue #92 remains open on whether native `executeTool()` must reject a mismatched result, so the check in this demo is an agent-harness safeguard. The requested Chrome build is `159.0.8140.0`; the GitHub Actions run below does not pin or report that exact build. For another host-side validation example, see GoogleChromeLabs/webmcp-extension PR #98.

On 15 November 2026, GitHub Actions ran `npm test` on the Chapter 9 demo: 21 browser/static checks and all 5 output-schema tests passed. The schema tests cover a valid result, wrong type or missing required field, tools without a schema, planner isolation from malformed output, and every documented Fjord Table return branch.

Sources: <https://github.com/webmachinelearning/webmcp/pull/254>, <https://github.com/webmachinelearning/webmcp/issues/92>, <https://github.com/GoogleChromeLabs/webmcp-extension/pull/98>.

'''
          if marker in text:
              text = text.replace(marker, section + marker, 1)
          elif section.strip() not in text:
              raise SystemExit('Chapter 9 test-results anchor not found')
          readme.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/verify-output-schema-tests.yml')
          config = workflow.read_text(encoding='utf-8')
          checkout = '      - uses: actions/checkout@v4\n        with:\n          ref: output-schema-update\n'
          if checkout in config:
              config = config.replace(checkout, '      - uses: actions/checkout@v4\n', 1)
          elif 'ref: output-schema-update' in config:
              raise SystemExit('Unexpected hardcoded checkout ref remains')
          workflow.write_text(config, encoding='utf-8')

          for name in (
              '.github/workflows/apply-output-schema-ci.yml',
              '.github/workflows/output-schema-tests.yml',
              '.github/workflows/repair-output-schema-tests.yml',
              '.github/workflows/finalize-output-schema-docs.yml',
              '.github/scripts/prepare-output-schema-ci.mjs',
          ):
              Path(name).unlink(missing_ok=True)
          print('Chapter 9 README updated; temporary workflows and scripts removed')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+actions[bot]@users.noreply.github.com"
          git add -A .github chapters/09-first-webmcp-app/README.md
          git commit -m "Document outputSchema validation and finalize CI"
          git push origin HEAD:output-schema-update