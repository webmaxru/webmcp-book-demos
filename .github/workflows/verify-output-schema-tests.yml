name: Verify WebMCP outputSchema demos

on:
  push:
    branches: [output-schema-update]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: output-schema-update
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fix Chapter 9 test setup and version the Appendix A expectations
        run: |
          python3 - <<'PY'
          from pathlib import Path

          chapter9 = Path('chapters/09-first-webmcp-app/tests/run-tests.mjs')
          lines = chapter9.read_text().splitlines(keepends=True)
          target = "const r = await page.waitForFunction(() => typeof window.testAgent?.call === 'function');"
          fixed = [line for line in lines if line.strip() != target]
          if fixed != lines:
              chapter9.write_text(''.join(fixed))
              print('Removed redundant waitForFunction binding')
          else:
              print('No redundant waitForFunction binding found')

          path = Path('appendices/a-api-reference/tests/run-tests.mjs')
          source = path.read_text()
          def replace_once(old, new, label):
              global source
              if new in source:
                  return
              if old not in source:
                  raise SystemExit(f'Expected Appendix A test anchor not found: {label}')
              source = source.replace(old, new, 1)

          replace_once(
              "assert.deepEqual(b.toolShape, versionAtLeast(out.version, '159.0.8140.0')\n        ? ['description', 'name', 'origin', 'outputSchema', 'title', 'window']\n        : ['description', 'name', 'origin', 'title', 'window']);",
              "assert.deepEqual(b.toolShape, versionAtLeast(out.version, '159.0.8140.0')\n        ? []\n        : ['description', 'name', 'origin', 'title', 'window']);",
              'Tool interface enumeration'
          )
          replace_once(
              "await test('Chromium differs: thrown/rejected execute -> UnknownError (draft: OperationError)', () => {\n  assert.match(b.execThrow, /^UnknownError/); assert.match(b.execReject, /^UnknownError/);\n});",
              "await test('execute errors: Chromium 156 UnknownError, newer Chromium OperationError', () => {\n  assert.match(b.execThrow, versionAtLeast(out.version, '159.0.8140.0') ? /^OperationError/ : /^UnknownError/);\n  assert.match(b.execReject, versionAtLeast(out.version, '159.0.8140.0') ? /^OperationError/ : /^UnknownError/);\n});",
              'execute failure names'
          )
          replace_once(
              "await test('Chromium differs: unregistered, forged name, forged origin -> UnknownError (draft: NotFoundError)', () => {\n  for (const k of ['execUnregistered', 'execForgedName', 'execForgedOrigin']) assert.match(b[k], /^UnknownError/, k);\n  assert.equal(b.afterUnregister, false);\n});",
              "await test('stale tools and plain objects use the browser-version-specific error', () => {\n  if (versionAtLeast(out.version, '159.0.8140.0')) {\n    assert.match(b.execUnregistered, /^NotFoundError/);\n    assert.match(b.execForgedName, /^TypeError/);\n    assert.match(b.execForgedOrigin, /^TypeError/);\n  } else {\n    for (const k of ['execUnregistered', 'execForgedName', 'execForgedOrigin']) assert.match(b[k], /^UnknownError/, k);\n  }\n  assert.equal(b.afterUnregister, false);\n});",
              'stale and forged tools'
          )
          replace_once(
              "await test('opaque origin \\\"null\\\" -> NotSupportedError (agrees)', () => assert.match(b.execOpaqueOrigin, /^NotSupportedError/));",
              "await test('opaque-origin Tool argument uses a browser-version-specific error', () => {\n  assert.match(b.execOpaqueOrigin, versionAtLeast(out.version, '159.0.8140.0') ? /^TypeError/ : /^NotSupportedError/);\n});",
              'opaque origin'
          )
          replace_once(
              "await test('Permissions-Policy: tools=() -> NotAllowedError from all three methods', () => {\n  assert.equal(out.blocked.allowsFeature, false);\n  assert.deepEqual([out.blocked.register, out.blocked.getTools, out.blocked.execute], ['NotAllowedError', 'NotAllowedError', 'NotAllowedError']);\n});",
              "await test('Permissions-Policy blocks registration and getTools; executeTool checks its Tool argument', () => {\n  assert.equal(out.blocked.allowsFeature, false);\n  assert.deepEqual([out.blocked.register, out.blocked.getTools], ['NotAllowedError', 'NotAllowedError']);\n  assert.equal(out.blocked.execute, versionAtLeast(out.version, '159.0.8140.0') ? 'TypeError' : 'NotAllowedError');\n});",
              'permissions policy'
          )
          replace_once(
              "await test('Chromium differs: target frame removed mid-call -> UnknownError (draft: AbortError)', () => {\n  assert.match(out.frames.frameRemovedMidCall, /^UnknownError/);\n});",
              "await test('removed frame aborts in newer Chromium; Chromium 156 reports UnknownError', () => {\n  assert.match(out.frames.frameRemovedMidCall, versionAtLeast(out.version, '159.0.8140.0') ? /^AbortError/ : /^UnknownError/);\n});",
              'removed frame'
          )
          replace_once(
              "await test('Chromium differs: re-registering the name during inputSchema serialization kills the renderer, crbug 573722078 (draft: InvalidStateError)', () => {\n  assert.equal(crashed, true, JSON.stringify(reentrant));\n});",
              "await test('re-entrant registration: Chromium 156 renderer crash, newer Chromium rejects the duplicate', () => {\n  if (versionAtLeast(out.version, '159.0.8140.0')) {\n    assert.equal(crashed, false, JSON.stringify(reentrant));\n    assert.deepEqual(reentrant, { outer: 'InvalidStateError', inner: 'resolved' });\n  } else {\n    assert.equal(crashed, true, JSON.stringify(reentrant));\n  }\n});",
              're-entrant registration'
          )
          path.write_text(source)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+actions[bot]@users.noreply.github.com"
          git add chapters/09-first-webmcp-app/tests/run-tests.mjs appendices/a-api-reference/tests/run-tests.mjs
          if ! git diff --cached --quiet; then
            git commit -m "Fix WebMCP 159 output-schema test expectations"
            git push origin HEAD:output-schema-update
          fi
      - name: Run all outputSchema suites
        shell: bash
        run: |
          set +e
          status=0
          for directory in chapters/09-first-webmcp-app chapters/17-the-road-ahead appendices/a-api-reference; do
            echo "===== $directory ====="
            cd "$GITHUB_WORKSPACE/$directory"
            npm install
            install_status=$?
            if [ "$install_status" -eq 0 ]; then
              npx playwright install --with-deps chromium
              install_status=$?
            fi
            test_status=0
            if [ "$install_status" -eq 0 ]; then
              npm test
              test_status=$?
            else
              test_status=$install_status
            fi
            if [ "$install_status" -eq 0 ]; then
              npm run test:chrome --if-present
              chrome_status=$?
              if [ "$chrome_status" -ne 0 ]; then test_status=$chrome_status; fi
            fi
            if [ "$test_status" -eq 0 ]; then
              echo "PASSED: $directory"
            else
              echo "FAILED: $directory (exit $test_status)"
              status=1
            fi
          done
          exit "$status"
